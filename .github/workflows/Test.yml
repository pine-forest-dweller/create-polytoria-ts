name: Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        type: [game]
    steps:
      - name: Checkout create-polyoria-ts repo
        uses: actions/checkout@v4
        with:
          path: create-polytoria-ts

      - name: Setup create-polytoria-ts repo
        run: |
          cd create-polytoria-ts
          npm install
          npm run build

      - name: Create template project
        run: node ./create-polytoria-ts/out/index.js ${{ matrix.type }} -y --dir project
      - name: Verify it builds
        run: |
          cd project
          npm run build
